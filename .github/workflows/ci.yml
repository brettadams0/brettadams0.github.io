name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the live site is still published by the built-in
# pages-build-deployment flow. This job builds a throwaway copy purely to
# catch breakage before it reaches production.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Mirrors the gem set GitHub Pages itself uses, so a build that passes
      # here is a build that will publish. No Gemfile is added to the repo,
      # which would change how the live Pages build resolves dependencies.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Check internal links and assets
        run: node .github/scripts/check-links.mjs

      # Hands the built site to the budget job.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Size keys only (handoff/tools/budget-ci.json). Timing keys stay local,
  # because shared runners vary.
  budget:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # Pinned to the Playwright version the budget was measured with.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      - name: Check the size budget
        run: node handoff/tools/measure.mjs --site _site --path / --path /mcp/ --path /404.html --path /mcp-surface/ --budget handoff/tools/budget-ci.json --runs 1
