name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the live site is still published by the built-in
# pages-build-deployment flow. This job builds a throwaway copy purely to
# catch breakage before it reaches production.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Mirrors the gem set GitHub Pages itself uses, so a build that passes
      # here is a build that will publish. No Gemfile is added to the repo,
      # which would change how the live Pages build resolves dependencies.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Check internal links and assets
        run: node .github/scripts/check-links.mjs

      # Hands the built site to the budget job.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  # Size keys only (.github/scripts/budget-ci.json). Timing keys stay local,
  # because shared runners vary.
  budget:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # Pinned to the Playwright version the budget was measured with.
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      # /border-waits/ reads its data from another repository's Pages (/border-waits-pipeline/data/v1/),
      # which this build doesn't have. Its saved export is a real recorded one, so it stands in at that
      # route: the page is then measured loaded with data, as visitors get it. The guard fails if the
      # page is missing or is showing its saved-snapshot state instead (the budget only has upper limits).
      - name: Give the border-waits demo recorded data
        run: |
          mkdir -p _site/border-waits-pipeline/data/v1
          cp -r _site/border-waits/fallback/. _site/border-waits-pipeline/data/v1/
          node .github/scripts/check-border-waits.mjs _site

      - name: Recalculate the published Signal Lab revenue investigation
        run: |
          python3 _site/projects/signal-lab/investigate/verify.py \
            _site/signal-lab/snapshots/v2/manifest.json \
            _site/signal-lab/snapshots/revenue/assessments-f0c524a49402dcca.json.gz \
            --check _data/signal_revenue_example.json

      - name: Check MazeFinder interactions
        run: node .github/scripts/check-mazefinder.mjs _site

      - name: Check authentic cover photos load when visible
        run: node .github/scripts/check-project-covers.mjs _site

      - name: Verify the shipped MCP checker and playground verdicts
        run: |
          npm ci --prefix .github/scripts/mcp-bundle
          npm run build --prefix .github/scripts/mcp-bundle
          git diff --exit-code -- mcp-surface/checks.js
          node .github/scripts/capture-mcp-real.mjs _site

      - name: Check the size budget
        run: node .github/scripts/measure.mjs --site _site --path / --path /mcp/ --path /404.html --path /mcp-surface/ --path /mazefinder/ --path /border-waits/ --budget .github/scripts/budget-ci.json --runs 1

  # border-waits/ is a verbatim copy of border-waits-pipeline's web/. A change to the copy has to match
  # what is on that repository's main branch (so the page ships after the pipeline that feeds it, and
  # nobody edits the copy here). When this change doesn't touch the copy, drift is reported, not failed.
  border-waits-sync:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: brettadams0/border-waits-pipeline
          path: upstream

      - name: Compare border-waits/ with upstream web/
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if .github/scripts/check-border-waits-sync.sh upstream; then exit 0; fi
          if git diff --quiet "$BASE" HEAD -- border-waits/ 2>/dev/null; then
            echo "::warning::border-waits/ is behind border-waits-pipeline's web/. Re-sync it (see README)."
          else
            echo "::error::This change edits border-waits/ but it does not match border-waits-pipeline's main. Merge the pipeline change first, then re-sync."
            exit 1
          fi
