name: Optimize authentic Signal Lab screenshot cover
on:
  push:
    branches: [covers/verified-software-previews]
    paths: [.github/workflows/real-signal-cover.yml]

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==11.3.0
      - name: Resize real captured software screenshot without generative editing
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          original = Path('assets/img/signal-lab-overview.webp')
          assert original.is_file()
          img = Image.open(original).convert('RGB')
          assert img.size == (1600, 1000), img.size
          thumbnail = img.resize((800, 500), Image.Resampling.LANCZOS)
          out = Path('assets/img/signal-lab-800.webp')
          thumbnail.save(out, 'WEBP', quality=67, method=6)
          print(f'{out}: {out.stat().st_size} bytes — genuine product screenshot')
          PY
      - name: Store optimized screenshot on preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/signal-lab-800.webp
          git commit -m 'Capture 800px authentic Signal Lab screenshot for homepage'
          git push
