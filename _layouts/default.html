<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/dist/img/logo.png" />
    {% seo %}

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
      crossorigin="anonymous"
    />

    <!-- Animation library styles -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/aos@3.0.0-beta.6/dist/aos.css"
      integrity="sha384-6oNXtl81GMcKAnWPPXinWlPskKUQ0NGG1/XeyMfC5RgCJKPc03w0rHVt1jyoJLf0"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" type="text/css" href="/dist/css/styles.css" />
    <link rel="stylesheet" type="text/css" href="/assets/css/blog.css" />

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EBYB5MK388"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EBYB5MK388');
    </script>
  </head>
  <body>
    <header id="blog-header">
      <nav id="nav">
        <div class="container nav-container">
          <a href="/index.html" id="logo">
            <img src="/dist/img/logo.png" alt="logo" width="1563" height="560">
          </a>
          <ul class="hide-for-mobile nav-links flex">
            <li><a href="/index.html#projects" class="link"><i class="fas fa-code"></i> Projects</a></li>
            <li><a href="/index.html#skills" class="link"><i class="fas fa-tools"></i> Skills</a></li>
            <li><a href="/index.html#education" class="link"><i class="fas fa-user-graduate"></i> Education</a></li>
            <li><a href="/blog/" class="link"><i class="fas fa-pen"></i> Blog</a></li>
            <li><a href="/index.html#contact" class="link"><i class="fas fa-envelope"></i> Contact</a></li>
          </ul>
        </div>
        <div class="mobile-menu hide-for-desktop">
          <div class="container">
            <div class="mobile-menu-links">
              <ul class="flex">
                <li><a href="/index.html#projects" class="link blue-hover">Projects</a></li>
                <li><a href="/index.html#skills" class="link blue-hover">Skills</a></li>
                <li><a href="/index.html#education" class="link blue-hover">Education</a></li>
                <li><a href="/blog/" class="link blue-hover">Blog</a></li>
                <li><a href="/index.html#contact" class="link blue-hover">Contact</a></li>
              </ul>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="blog-main container">
      {{ content }}
    </main>

    <footer id="footer" class="footer">
      <div class="container">
        <div class="footer-flex">
          <img src="/dist/img/logo.png" alt="logo" id="logo-footer" width="1563" height="560">
          <div class="footer-icon-links">
            <a href="https://github.com/brettadams0" aria-label="GitHub" target="_blank"><i class="fab fa-github fa-2x"></i></a>
            <a href="https://www.linkedin.com/in/BrettA/" aria-label="LinkedIn" target="_blank"><i class="fab fa-linkedin fa-2x"></i></a>
            <a href="mailto:adamsbrett00@gmail.com" aria-label="Email" target="_blank"><i class="fas fa-envelope fa-2x"></i></a>
          </div>
        </div>
      </div>
    </footer>

    <button id="backToTopBtn" class="btn-blue" aria-label="Back to top" type="button">
      <i class="fa fa-chevron-up"></i>
    </button>

    <script>
      const backToTopBtn = document.getElementById("backToTopBtn");
      window.addEventListener("scroll", function () {
        if (window.scrollY > 300) {
          backToTopBtn.classList.add("show");
        } else {
          backToTopBtn.classList.remove("show");
        }
      });
      backToTopBtn.addEventListener("click", function (e) {
        e.preventDefault();
        var prefersReducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;
        window.scrollTo({
          // "auto" defers to CSS `scroll-behavior`, which is smooth site-wide —
          // "instant" is required to actually bypass that for reduced-motion users.
          top: 0,
          behavior: prefersReducedMotion ? "instant" : "smooth",
        });
      });
    </script>

    <!-- AOS Animations -->
    <script
      src="https://unpkg.com/aos@3.0.0-beta.6/dist/aos.js"
      integrity="sha384-ZGo5k5ISlEzWLoXyt+lnvKt9j03Z7GkxXh14zLqVy098XJhcdKHjL8pQYVMI8WiH"
      crossorigin="anonymous"
    ></script>
    <script>
      AOS.init({
        disable: function () {
          return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        }
      });
    </script>
  </body>
</html>
