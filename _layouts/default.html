<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />
    {% seo %}
    {% if page.url == "/" %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "mainEntity": {
        "@type": "Person",
        "name": "Brett Adams",
        "jobTitle": "Data Analyst Intern",
        "worksFor": { "@type": "Organization", "name": "Geotab" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "University of Windsor" },
        "url": "{{ site.url }}/",
        "sameAs": [
          "https://github.com/brettadams0",
          "https://www.linkedin.com/in/bretta/"
        ]
      }
    }
    </script>
    {% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
    {% include analytics.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="wrap site-header-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">Brett Adams</a>
        <nav class="site-nav" aria-label="Main">
          <a class="nav-section" href="{{ '/#experience' | relative_url }}">Experience</a>
          <a class="nav-section" href="{{ '/#projects' | relative_url }}">Projects</a>
          <a class="nav-section" href="{{ '/#skills' | relative_url }}">Skills</a>
          {% if site.posts.size > 0 %}<a class="nav-section" href="{{ '/#writing' | relative_url }}">Writing</a>{% endif %}
          <a class="nav-section" href="{{ '/#contact' | relative_url }}">Contact</a>
          <a class="nav-resume" href="{{ '/assets/resume/Resume_BrettAdams.pdf' | relative_url }}">Résumé</a>
        </nav>
      </div>
    </header>

    <main id="main" class="wrap">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="wrap site-footer-inner">
        <p>&copy; {{ site.time | date: "%Y" }} Brett Adams</p>
        <p>
          <a href="https://github.com/brettadams0">GitHub</a>
          <a href="https://www.linkedin.com/in/bretta/">LinkedIn</a>
          <a href="mailto:adamsbrett00@gmail.com">Email</a>
        </p>
      </div>
    </footer>
  </body>
</html>
