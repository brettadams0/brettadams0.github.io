---
layout: default
---
<article class="post">
  <p class="post-back"><a href="{{ '/#writing' | relative_url }}">&larr; Brett Adams</a></p>
  <h1>{{ page.title }}</h1>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <div class="post-body">
    {{ content }}
  </div>
</article>
